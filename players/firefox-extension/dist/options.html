<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Mansion Karaoke Player settings</title></head>
<body>
  <main>
    <h1>Mansion Karaoke Player</h1>
    <p>Set the controller URL and bearer token supplied by your local control plane.</p>
    <form id="config-form">
      <label>Controller URL <input id="base-url" type="url" required></label>
      <label>Bearer token <input id="token" type="password" autocomplete="off"></label>
      <fieldset>
        <legend>Singer overlay</legend>
        <label><input id="overlay-now-singing" type="checkbox"> Show “Now singing” chip while a song plays</label>
        <label><input id="overlay-up-next-always" type="checkbox"> Always show “Up next” when the queue has a song</label>
        <label>“Up next” appears <input id="overlay-up-next-seconds" type="number" min="0" max="600" step="5" size="4"> seconds before the song ends (0 = timed card off)</label>
      </fieldset>
      <fieldset>
        <legend>Experimental</legend>
        <label><input id="exp-host-fullscreen" type="checkbox"> Host controls fullscreen (disables auto-presentation; use guest Controls → Fullscreen)</label>
      </fieldset>
      <button type="submit">Save settings</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
