name: macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/macos-app.yml'
      - 'apps/control-plane/**'
      - 'packages/playback-protocol/**'
      - 'players/firefox-extension/**'
      - 'packaging/macos/**'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          bun install --no-save
          bun install --cwd players/firefox-extension --no-save

      - name: Test controller
        run: bun --cwd apps/control-plane test

      - name: Test and verify Firefox extension
        run: |
          bun run firefox:test
          bun run firefox:check
          bun run firefox:build
          bun run firefox:verify

      - name: Test app bundle
        run: bun run macos:test

      - name: Build distributable app
        run: ./packaging/macos/build-app.sh --output dist/macos --arch '${{ matrix.arch }}'

      - name: Verify bundle signature and architecture
        run: |
          codesign --verify --deep --strict 'dist/macos/Mansion Karaoke.app'
          [[ "$(lipo -archs 'dist/macos/Mansion Karaoke.app/Contents/MacOS/Mansion Karaoke')" == '${{ matrix.arch }}' ]]
          [[ "$(lipo -archs 'dist/macos/Mansion Karaoke.app/Contents/Resources/mansion-controller')" == '${{ matrix.arch }}' ]]

      - name: Package release asset
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/macos/Mansion Karaoke.app/Contents/Info.plist')"
          ASSET="Mansion-Karaoke-${VERSION}-macOS-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent 'dist/macos/Mansion Karaoke.app' "dist/macos/${ASSET}"
          shasum -a 256 "dist/macos/${ASSET}" > "dist/macos/${ASSET}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mansion-Karaoke-macOS-${{ matrix.arch }}
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: Mansion-Karaoke-macOS-*
          path: dist
          merge-multiple: true

      - name: Validate tag version
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          for asset in dist/Mansion-Karaoke-*-macOS-*.zip; do
            case "$asset" in
              *"Mansion-Karaoke-${EXPECTED}-macOS-"*) ;;
              *) echo "Asset version does not match tag: $asset" >&2; exit 1 ;;
            esac
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum Mansion-Karaoke-*-macOS-*.zip > checksums.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              Mansion-Karaoke-*-macOS-*.zip \
              checksums.txt \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              Mansion-Karaoke-*-macOS-*.zip \
              checksums.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mansion Karaoke ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
